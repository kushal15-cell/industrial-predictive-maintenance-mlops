data:
  raw_path: data/raw/CMAPSSData
  processed_path: data/processed
  file_name: train_FD001.txt

features:
  rul_clip: 125

model:
  test_size: 0.2
  random_state: 42
  n_estimators: 100
  max_depth: null

mlflow:
  experiment_name: industrial_predictive_maintenance

monitoring:
  reference_path: monitoring/reference_data.csv
  production_path: monitoring/production_data.csv
  report_dir: monitoring/reports

  warning_rul: 30
  critical_rul: 15

  drift_threshold: 0.30
  prediction_drift_threshold: 0.30

  performance:
    rmse_multiplier: 1.25
    mae_multiplier: 1.25

agent:
  min_drift_features: 2
  require_performance_degradation: true

  approval_required: true

  github:
    workflow: retrain.yml
    branch: main