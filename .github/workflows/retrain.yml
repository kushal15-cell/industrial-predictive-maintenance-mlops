name: Model Retraining

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for retraining"
        required: true
        default: "MLOps agent recommendation"
      approved:
        description: "Human approval"
        required: true
        type: choice
        options:
          - "true"
          - "false"

jobs:

  retrain:

    if: ${{ github.event.inputs.approved == 'true' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show retraining reason
        run: |
          echo "Retraining reason:"
          echo "${{ github.event.inputs.reason }}"

      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Train model
        run: |
          python -m src.models.train_model

      - name: Verify model
        run: |
          test -f models/random_forest_rul_model.pkl

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrained-model
          path: models/random_forest_rul_model.pkl